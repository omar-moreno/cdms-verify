[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdms-verify"
version = "0.1.0"
description = "Verify local files against the CDMS Data Catalog and persist results."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Omar Moreno" }]
dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pre-commit>=3.5",
    "ruff>=0.8",
]

[project.scripts]
cdms-verify = "cdms_verify.cli:verify_catalog_registration"

[tool.setuptools]
packages = ["cdms_verify"]

[tool.setuptools.package-data]
cdms_verify = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
# A sensible, not-overbearing rule set.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert-heavy style and don't need every lint.
"tests/*" = ["B011"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true    # format code inside docstrings too
