apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdf-data-supercdms-db-rw
spec: 
  storageClassName: sdf-data-supercdms
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sdf-data-supercdms-ro
spec: 
  storageClassName: sdf-data-supercdms
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
