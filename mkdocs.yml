site_name: CDMS Verify
site_url: https://omar-moreno.github.io/cdms-verify
site_description: Verify local files against the CDMS Data Catalog and persist results.
repo_url: https://github.com/your-org/cdms-verify
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Database Schema: database.md
  - Development: development.md
  - API Reference:
      - paths: api/paths.md
      - scanning: api/scanning.md
      - catalog: api/catalog.md
      - database: api/database.md
      - cli: api/cli.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
